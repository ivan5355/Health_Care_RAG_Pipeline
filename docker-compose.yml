services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./sample_eob.txt:/app/sample_eobs/sample_eob.txt:ro
      - ./sample_eob_denied.txt:/app/sample_eobs/sample_eob_denied.txt:ro
      - ./sample_eob_multiline.txt:/app/sample_eobs/sample_eob_multiline.txt:ro
      - ./sample_eob_preventive.txt:/app/sample_eobs/sample_eob_preventive.txt:ro
    environment:
      - SAMPLE_EOB_DIR=/app/sample_eobs
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
