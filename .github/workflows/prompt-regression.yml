name: Prompt Regression Check

on:
  pull_request:
    paths:
      - "backend/prompts/**"

jobs:
  prompt-regression:
    runs-on: ubuntu-latest
    environment: prompt-eval
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Detect changed prompt versions
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- prompts/ | grep -oP 'v\d+' | sort -u | tr '\n' ' ')
          echo "changed_versions=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No prompt version files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed versions: $CHANGED"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evaluation comparison
        if: steps.detect.outputs.skip == 'false'
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from services.evaluator import run_comparison

          changed = '${{ steps.detect.outputs.changed_versions }}'.split()
          baseline = 'v1'
          blocked = False

          for version in changed:
              if version == baseline:
                  continue
              print(f'Comparing {baseline} vs {version}...')
              result = run_comparison(baseline, version)
              print(json.dumps(result['regression_check'], indent=2))
              if result['regression_check'].get('blocked'):
                  print(f'BLOCKED: {version} regresses beyond tolerance')
                  blocked = True

          if blocked:
              sys.exit(1)
          print('All prompt versions passed regression check')
          "

      - name: Post results as PR comment
        if: always() && steps.detect.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success'
              ? '✅ Prompt regression check passed'
              : '❌ Prompt regression check FAILED — metrics regressed beyond 5% tolerance';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Prompt Regression Check\n\n${conclusion}\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });
