services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-ivan5355/health_care_rag_pipeline}/backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - SAMPLE_EOB_DIR=/app/sample_eobs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-ivan5355/health_care_rag_pipeline}/frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
